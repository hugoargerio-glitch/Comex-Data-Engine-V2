name: Comex Fiduciary Engine HTAP & ODCS v3.2.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-comex-engine:
    name: HTAP Multi-Model + ODCS v3.2.0 + PyTest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv (Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Environment Variables
        run: cp .env.example .env

      - name: Start PostgreSQL 16 & MongoDB 7 (Docker Compose)
        run: |
          docker compose up -d
          # Aguarda os containers ficarem saudáveis
          timeout 30s bash -c 'until docker compose ps | grep -q "(healthy)"; do sleep 2; done'
          docker compose ps

      - name: Sync Virtual Environment (.venv)
        run: uv sync

      - name: Gate 1 — Lint Executable Data Contracts (ODCS v3.2.0)
        run: |
          uv run datacontract lint ./contracts/canonical_document_v1.odcs.yaml
          uv run datacontract lint ./contracts/comex_fiduciary_engine_v2.odcs.yaml

      - name: Gate 2 — Seed Multi-Model Databases (Postgres, Mongo, DuckDB)
        run: |
          uv run python -m src.seed

      - name: Gate 3 — Run PyTest Suite (Unit, Mathematical & Integration Tests)
        run: |
          uv run pytest tests/ -v
