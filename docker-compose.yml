services:
  postgres:
    image: postgres:16-alpine
    container_name: comex_postgres_v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comex_pass}
      POSTGRES_DB: ${POSTGRES_DB:-comex_fiduciary_db}
    volumes:
      - comex_postgres_data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comex_user} -d ${POSTGRES_DB:-comex_fiduciary_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: comex_mongodb_v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-comex_mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-comex_mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-comex_raw_lake}
    volumes:
      - comex_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"if (!db.adminCommand('ping').ok) quit(1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comex_api_v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-comex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comex_pass}
      POSTGRES_DB: ${POSTGRES_DB:-comex_fiduciary_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-comex_user}:${POSTGRES_PASSWORD:-comex_pass}@postgres:5432/${POSTGRES_DB:-comex_fiduciary_db}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-comex_raw_lake}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-comex_mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-comex_mongo_pass}
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-comex_mongo_user}:${MONGO_INITDB_ROOT_PASSWORD:-comex_mongo_pass}@mongodb:27017/${MONGO_DB:-comex_raw_lake}?authSource=admin
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${API_KEY:-dev-comex-api-key-local-only}
      AUDITOR_API_KEY: ${AUDITOR_API_KEY:-dev-comex-auditor-key-local-only}
      PII_HASH_SALT: ${PII_HASH_SALT:-dev-comex-pii-salt-local-only}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DUCKDB_PATH: ${DUCKDB_PATH:-./data/comex_lakehouse.duckdb}
      PARQUET_BASE_DIR: ${PARQUET_BASE_DIR:-./data/parquet_lakehouse}
    volumes:
      - comex_lakehouse_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  comex_postgres_data:
    driver: local
  comex_mongo_data:
    driver: local
  comex_lakehouse_data:
    driver: local
